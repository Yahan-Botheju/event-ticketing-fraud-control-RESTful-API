spring.application.name=event.ticketing.fraud.control.resetful.api
server.port=5000
spring.datasource.url=jdbc:postgresql://localhost:5432/event.ticketing.system.db?currentSchema=identity_security,ticketing_schema
spring.datasource.username=postgres
spring.datasource.password=__YOUR_DB_PASSWORD__

# Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
